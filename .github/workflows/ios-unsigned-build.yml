name: iOS Unsigned Build (TrollStore)

# 这个 workflow 生成一个未签名（ad-hoc）的 IPA，可用 TrollStore 直接安装。
# 不需要 Apple Developer 账号、不需要任何证书或 App Store Connect 密钥。
# 完全使用 GitHub 提供的免费 macOS runner。
#
# 用法：
#   1. Fork 仓库到自己账号（建议公开仓库，Actions 免费无限制）
#   2. 进入 Actions 标签页，选择 "iOS Unsigned Build (TrollStore)"
#   3. 点击 "Run workflow" 手动触发
#   4. 构建完成后，在运行结果里下载 artifact "TauriTavern-ios15-unsigned-ipa"
#   5. 解压得到 .ipa，用 TrollStore 安装

on:
  push:
    branches:
      - docs-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    name: Build unsigned IPA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain (iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run web:build

      # gen/apple 目录被 .gitignore 忽略，必须先 init 生成 Xcode 工程
      - name: Init Tauri iOS project
        run: pnpm exec tauri ios init

      - name: Patch iOS deployment target and signing
        shell: bash
        run: |
          set -euo pipefail
          APPLE_DIR="$GITHUB_WORKSPACE/src-tauri/gen/apple"
          PROJ_YML="$APPLE_DIR/project.yml"
          PBX="$APPLE_DIR/tauritavern.xcodeproj/project.pbxproj"

          echo "=== Files in gen/apple ==="
          ls -la "$APPLE_DIR/" || true

          # 1) 部署目标改为 iOS 15.0（兼容 iOS 15 系统）
          if [ -f "$PROJ_YML" ]; then
            echo "--- Before patch: project.yml ---"
            cat "$PROJ_YML"
            sed -i '' -E 's/(iOS: *)[0-9]+\.[0-9]+/\115.0/g' "$PROJ_YML"
            echo "--- After patch: project.yml ---"
            grep -nE 'deploymentTarget|iOS' "$PROJ_YML" || true
          else
            echo "WARNING: project.yml not found, will try patching pbxproj directly"
          fi

          # 2) 重新生成 .xcodeproj（project.yml 是 XcodeGen 的源）
          if command -v xcodegen >/dev/null 2>&1; then
            echo "Running xcodegen..."
            (cd "$APPLE_DIR" && xcodegen generate)
          else
            echo "xcodegen not found, installing..."
            brew install xcodegen
            (cd "$APPLE_DIR" && xcodegen generate)
          fi

          # 3) 清空原作者写死的团队 ID，签名身份改成 ad-hoc（"-"）
          if [ -f "$PBX" ]; then
            echo "--- Before patch: signing settings ---"
            grep -nE 'DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY' "$PBX" || true

            sed -i '' \
              -e 's/DEVELOPMENT_TEAM = "[^"]*";/DEVELOPMENT_TEAM = "";/g' \
              -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "-";/g' \
              -e 's/CODE_SIGN_IDENTITY = "iOS Development";/CODE_SIGN_IDENTITY = "-";/g' \
              "$PBX"

            echo "--- After patch: signing settings ---"
            grep -nE 'DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY' "$PBX" || true
          fi

      - name: Build iOS app with xcodebuild (skip signing)
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          DEVELOPMENT_TEAM: ""
        run: |
          set -euo pipefail
          APPLE_DIR="$GITHUB_WORKSPACE/src-tauri/gen/apple"
          echo "Building iOS app with xcodebuild..."
          xcodebuild \
            -project "$APPLE_DIR/tauritavern.xcodeproj" \
            -scheme tauritavern_iOS \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$APPLE_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ARCHS=arm64 \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" || {
              echo "=== Build failed ==="
              tail -100 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            }

      - name: Locate built .app and package as IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APPLE_DIR="$GITHUB_WORKSPACE/src-tauri/gen/apple"

          echo "=== Searching for .app bundles ==="
          find "$APPLE_DIR" -type d -name "*.app" || true
          echo "=== Searching build directory ==="
          find "$APPLE_DIR" -type d -name "build" -exec ls -laR {} \; 2>/dev/null || true
          echo "=== Searching DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null || true

          # 尝试多种路径模式来找到 .app
          APP_PATH=""
          # 1) xcodebuild 输出路径（-derivedDataPath 指定了 build 目录）
          for candidate in \
            "$APPLE_DIR/build/Build/Products/Debug-iphoneos/TauriTavern.app" \
            "$APPLE_DIR/build/Build/Products/Debug/TauriTavern.app"; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          # 2) 在 DerivedData 中搜索
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "TauriTavern.app" -path "*Debug*" | head -n 1)
          fi

          # 3) 通用搜索
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$APPLE_DIR" -type d -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App bundle not found anywhere"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          STAGING="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"

          IPA="$RUNNER_TEMP/TauriTavern-ios15-unsigned.ipa"
          rm -f "$IPA"
          (cd "$STAGING" && zip -r -y "$IPA" Payload > /dev/null)

          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-ios15-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30
